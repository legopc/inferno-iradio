# iradio-bridge configuration
# Copy to /etc/iradio/config.toml and adjust as needed.
# All fields are optional — defaults are shown below.

# TCP port the web UI and REST API listens on
port = 8765

# Maximum concurrent player slots (each = 1 stereo Dante TX pair), 1–4
# On the Inferno appliance this is managed by cockpit-inferno.
max_players = 4

# Where favourites are persisted
favourites_path = "/var/lib/iradio/favourites.json"

# Where per-slot default volumes are persisted (restored on next start)
volumes_path = "/var/lib/iradio/volumes.json"

[auth]
# Set to true to require HTTP Basic Auth for all routes (except /api/v1/health)
enabled = false
username = ""
password = ""
# Credentials can also be supplied via environment:
#   IRADIO_AUTH_USER=admin IRADIO_AUTH_PASS=secret

[alsa]
# Auto-write pcm.inferno_iradio_N blocks to asoundrc_path on startup.
# Requires the Inferno appliance to already have a configured .asoundrc
# (with BIND_IP, DEVICE_ID, CLOCK_PATH present).
setup_alsa = true
# Path to .asoundrc — defaults to $HOME/.asoundrc at runtime
asoundrc_path = "/var/home/core/.asoundrc"
# Target sample rate for Inferno PCM (must match Dante clock domain)
sample_rate = 48000
# ALSA PCM buffer in frames
buffer_frames = 4096

[radiobrowser]
# Leave empty to auto-resolve the best RadioBrowser server via DNS
# (recommended — uses all.api.radio-browser.info)
api_url = ""
# HTTP request timeout in seconds
request_timeout_secs = 10
