[package]
name = "iradio-bridge"
version = "0.1.0"
edition = "2021"
description = "Internet Radio → Dante AoIP bridge (Inferno appliance)"
license = "MIT"

[[bin]]
name = "iradio-bridge"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client (stream fetch)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# Audio decode
symphonia = { version = "0.5", features = ["mp3", "aac", "vorbis", "flac", "ogg"] }
# Resampling
rubato = "0.15"
# ALSA
alsa = "0.9"
# Asset embedding
rust-embed = { version = "8", features = ["compression"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config
toml = "0.8"
# CLI
clap = { version = "4", features = ["derive", "env"] }
# IDs
uuid = { version = "1", features = ["v4", "serde"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Misc
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures-util = "0.3"
base64 = "0.22"
anyhow = "1"
urlencoding = "2"
mime_guess = "2"

[dev-dependencies]
axum-test = "14"
